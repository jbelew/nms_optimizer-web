# Lefthook configuration for nms_optimizer-web
# Faster, Bun-friendly git hooks
#
# Per-file-type commands run only against staged files matching their glob.
# A metadata-only commit will skip every file-scoped command automatically.

pre-commit:
  piped: true
  commands:
    # ----- Early commit message check (catches commitlint errors immediately) -----
    commitlint-early:
      tags: lint
      run: bun scripts/check-commit-msg-early.mjs

    # ----- Policy gate (always runs) -----
    beads-enforcement:
      tags: policy
      run: |
        STAGED_FILES=$(git diff --cached --name-only)
        BEADS_MATCHES=$(printf '%s\n' "$STAGED_FILES" | grep -E "^\.beads/" | grep -vE "(\.pid|\.beads-credential-key)$" | wc -l || true)
        CONDUCTOR_MATCHES=$(printf '%s\n' "$STAGED_FILES" | grep -cE "^conductor/|^plan\.md|^task\.md" || true)
        if [ "$BEADS_MATCHES" -gt 0 ] && [ "$CONDUCTOR_MATCHES" -eq 0 ]; then
          ACTIVE_TRACKS=$(grep -r "\"status\": \"in-progress\"" conductor/tracks/ 2>/dev/null | wc -l)
          if [ "$ACTIVE_TRACKS" -eq 0 ]; then
            echo "❌ ERROR: Beads data modified without corresponding Conductor context."
            echo "This project requires Beads to be used only in conjunction with Conductor."
            exit 1
          fi
        fi

    # ----- Lint & format (per-file-type, scoped to staged files) -----
    # oxlint + eslint run sequentially in one command to avoid races on --fix
    lint-js:
      tags: lint
      glob: "*.{js,jsx,ts,tsx,cjs,mjs}"
      exclude: "*.d.ts"
      run: bunx oxlint --fix {staged_files} && bunx eslint --fix {staged_files}
      stage_fixed: true

    stylelint:
      tags: lint
      glob: "*.scss"
      run: bunx stylelint --fix {staged_files}
      stage_fixed: true

    lint-md:
      tags: lint
      glob: "{README.md,public/assets/**/*.md}"
      run: bunx markdownlint-cli2 --no-globs --fix {staged_files}
      stage_fixed: true

    prettier:
      tags: format
      glob: "{src/**/*.{ts,tsx,js,jsx,cjs,mjs,css,scss,json,html},README.md,public/assets/**/*.md}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    # ----- Fast validation checks (only when relevant source changes) -----
    typecheck:
      tags: types
      glob: "*.{ts,tsx}"
      # tsc -b uses project references and cannot be scoped to individual files
      run: bun run typecheck

    test:
      tags: test
      glob: "{src,shared}/**/*.{ts,tsx,js,mjs,cjs}"
      run: bun run test:related {staged_files}

    test-scripts:
      tags: test
      glob: "scripts/**/*.{ts,js,mjs,cjs}"
      run: bun run test:scripts

pre-push:
  piped: true
  commands:
    # ----- Early remote sync check (catches out-of-sync remote before running expensive checks) -----
    check-remote-sync:
      tags: sync
      run: bun scripts/check-remote-sync.mjs

    # ----- Full repository safety barrier before pushing to remote (fastest to slowest) -----
    test-scripts:
      tags: test
      run: bun run test:scripts

    typecheck:
      tags: types
      run: bun run typecheck

    knip:
      tags: lint
      run: bun run lint:knip

    circular:
      tags: lint
      run: bun run lint:circular

    lint:
      tags: lint
      run: bun run lint

    test:
      tags: test
      run: bun run test:unit

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

