		<script>
			(function () {
				function purgeWorkersAndCaches() {
					const unregisterWorkers =
						"serviceWorker" in navigator ?
							navigator.serviceWorker
								.getRegistrations()
								.then((regs) => Promise.all(regs.map((r) => r.unregister())))
								.catch(() => {})
						:	Promise.resolve();
					const clearCaches =
						"caches" in window ?
							caches
								.keys()
								.then((names) => Promise.all(names.map((n) => caches.delete(n))))
								.catch(() => {})
						:	Promise.resolve();
					return Promise.all([unregisterWorkers, clearCaches]);
				}

				function buildCacheBustUrl() {
					const url = new URL(window.location.href);
					url.searchParams.set("_cb", String(Date.now()));
					return url.pathname + url.search + url.hash;
				}

				function initPreloadErrorRecovery() {
					const MARKER = "__preload_recovery__";
					const MODULE_ERROR_RE =
						/importing a module script failed|error resolving module specifier|failed to fetch dynamically imported module|error loading dynamically imported module|unable to preload css/i;
					let recoveryInProgress = false;

					function handleStaleChunkError(payloadMessage) {
						if (recoveryInProgress) return;
						recoveryInProgress = true;
						try {
							const prev = parseInt(
								sessionStorage.getItem("__recovery_attempts__") || "0",
								10,
							);
							sessionStorage.setItem("__recovery_attempts__", String(prev + 1));
						} catch {}

						let firstAttempt = false;
						try {
							if (!sessionStorage.getItem(MARKER)) {
								sessionStorage.setItem(MARKER, "1");
								firstAttempt = true;
							}
						} catch {
							if (window.name !== MARKER) {
								window.name = MARKER;
								firstAttempt = true;
							} else {
								window.name = "";
							}
						}

						if (firstAttempt) {
							const reloadUrl = buildCacheBustUrl();
							let reloaded = false;
							const doReload = () => {
								if (!reloaded) {
									reloaded = true;
									window.location.replace(reloadUrl);
								}
							};
							setTimeout(doReload, 500);
							purgeWorkersAndCaches().then(doReload);
							return;
						}

						try {
							sessionStorage.removeItem(MARKER);
						} catch {}
						if (window.name === MARKER) {
							window.name = "";
						}
						let errorUrl = "/500.html?error_type=stale_chunk";
						if (payloadMessage)
							errorUrl += "&error_cause=" + encodeURIComponent(payloadMessage);
						window.location.replace(errorUrl);
					}

					window.addEventListener("vite:preloadError", (e) => {
						e.preventDefault();
						handleStaleChunkError(e.payload?.message);
					});

					// E2E Test hook for deterministic error triggering.
					// Fire synchronously so the recovery wins the race against
					// readiness initialization (which clears the recovery marker on boot).
					try {
						if (sessionStorage.getItem("__TEST_TRIGGER_ERROR__")) {
							sessionStorage.removeItem("__TEST_TRIGGER_ERROR__");
							handleStaleChunkError("TEST_TRIGGERED_ERROR");
						}
					} catch {}

					window.addEventListener(
						"error",
						(e) => {
							const isModuleError = MODULE_ERROR_RE.test(e.message || "");
							const target = e.target;
							const isBuildScriptError =
								target
								&& target.nodeName === "SCRIPT"
								&& typeof target.src === "string"
								&& target.src.includes("/build/");

							if (isModuleError || isBuildScriptError) {
								e.preventDefault();
								e.stopImmediatePropagation();
								handleStaleChunkError(e.message || "Script load error");
							}
						},
						true,
					);
				}

				function preloadCriticalResources() {
					const supportedLngs = ["en", "es", "fr", "de", "pt", "it"];
					const pathSegment = window.location.pathname.split("/")[1];
					const detectedLng = supportedLngs.includes(pathSegment) ? pathSegment : "en";
					const rawApiUrl = "%VITE_API_URL%";
					const apiUrl = (
						rawApiUrl && !rawApiUrl.startsWith("%") ?
							rawApiUrl
						:	"https://api.nms-optimizer.app").replace(/\/+$/, "");

					const preload = (href, as, type) => {
						const link = document.createElement("link");
						link.rel = "preload";
						link.as = as;
						link.href = href;
						link.crossOrigin = "anonymous";
						link.setAttribute("fetchpriority", "high");
						if (type) link.type = type;
						document.head.appendChild(link);
					};

					preload(
						"/assets/locales/" + detectedLng + "/translation.json",
						"fetch",
						"application/json",
					);
					preload(apiUrl + "/platforms", "fetch");

					let platform = "standard";
					try {
						platform =
							new URLSearchParams(window.location.search).get("platform")
							|| localStorage.getItem("selectedPlatform")
							|| "standard";
					} catch (e) {}
					preload(apiUrl + "/tech_tree/" + encodeURIComponent(platform), "fetch");
				}

				function applyEnvironmentClasses() {
					const botPattern =
						/bot|crawl|spider|slurp|mediapartners|facebookexternalhit|ia_archiver|googlebot|google-inspectiontool|adsbot-google|apis-google|lighthouse|chrome-lighthouse|pingdom|uptime|speedcurve|headless|phantom|webdriver|pinterest|whatsapp|twitterbot|linkedinbot|embedly|quora|outbrain|rogerbot|bufferbot|duckduckbot|semrushbot|ahrefsbot|mj12bot|dotbot|archive\.org|baidu/i;
					const botBrandPattern = /headless|lighthouse|phantom|webdriver/i;
					const hasBotBrand =
						navigator.userAgentData
						&& Array.isArray(navigator.userAgentData.brands)
						&& navigator.userAgentData.brands.some(
							(b) => b && botBrandPattern.test(b.brand || ""),
						);
					if (
						botPattern.test(navigator.userAgent)
						|| navigator.webdriver === true
						|| hasBotBrand
					) {
						document.documentElement.classList.add("is-bot", "background-visible");
					}
					document.documentElement.classList.add("js-enabled");
				}

				initPreloadErrorRecovery();
				preloadCriticalResources();
				applyEnvironmentClasses();
			})();
		</script>
